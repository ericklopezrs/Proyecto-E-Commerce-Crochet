<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sin conexión — Peluches Crochet</title>
  <meta name="theme-color" content="#baa2f3" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
      background: #f1f5f9; color: #0f172a;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }
    main {
      width: 100%; max-width: 440px; background: #fff; border-radius: 16px; padding: 32px 24px;
      text-align: center; box-shadow: 0 4px 24px rgba(15, 23, 42, .08);
    }
    img { width: 96px; height: 96px; }
    h1 { font-size: 22px; margin: 12px 0 8px; }
    p { color: #64748b; line-height: 1.5; margin: 0 0 20px; }
    .acciones { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
    a.btn, button {
      font: inherit; font-weight: 600; padding: 10px 18px; border-radius: 10px;
      border: 2px solid #baa2f3; cursor: pointer; text-decoration: none;
    }
    button { background: #baa2f3; color: #fff; }
    a.btn { background: #fff; color: #7c5cc4; }
    #guardadas { margin-top: 24px; text-align: left; display: none; }
    #guardadas h2 { font-size: 14px; color: #64748b; margin: 0 0 8px; }
    #guardadas ul { list-style: none; margin: 0; padding: 0; }
    #guardadas a { display: block; padding: 8px 0; color: #7c5cc4; border-top: 1px solid #e2e8f0; }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="Peluches Crochet" />
    <h1>Estás sin conexión</h1>
    <p>Esta página todavía no está guardada en tu dispositivo. Conéctate a internet para verla, o revisa lo que ya visitaste.</p>
    <div class="acciones">
      <button id="reintentar">Reintentar</button>
      <a class="btn" href="/">Ir al inicio</a>
    </div>
    <section id="guardadas">
      <h2>Disponible sin conexión</h2>
      <ul id="lista"></ul>
    </section>
  </main>

  <script>
    document.getElementById('reintentar').addEventListener('click', () => location.reload());
    window.addEventListener('online', () => location.reload());

    // Lista las páginas que el Service Worker ya tiene guardadas
    (async () => {
      if (!('caches' in window)) return;
      const rutas = new Set();
      for (const nombre of await caches.keys()) {
        if (!nombre.startsWith('paginas-')) continue;
        const cache = await caches.open(nombre);
        for (const req of await cache.keys()) rutas.add(new URL(req.url).pathname);
      }
      if (!rutas.size) return;

      const lista = document.getElementById('lista');
      [...rutas].sort().forEach((ruta) => {
        const li = document.createElement('li');
        const a = document.createElement('a');
        a.href = ruta;
        a.textContent = ruta === '/' ? 'Catálogo' : 'Producto #' + ruta.split('/').pop();
        li.appendChild(a);
        lista.appendChild(li);
      });
      document.getElementById('guardadas').style.display = 'block';
    })();
  </script>
</body>
</html>
